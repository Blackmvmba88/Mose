# MOSE Configuration File
# User-adjustable parameters for eye tracking and cursor control

[detection]
# Face detection confidence (0.0 to 1.0)
# Higher values = more stable but may lose tracking more easily
min_detection_confidence = 0.5
min_tracking_confidence = 0.5

[blink]
# Eye aspect ratio threshold for blink detection
# Lower values = easier to trigger clicks
# Typical range: 0.003 to 0.006
threshold = 0.0045

# Cooldown between clicks in seconds
# Prevents multiple clicks from single blink
# Typical range: 0.2 to 0.5
cooldown = 0.3

[gaze]
# Smoothing buffer size (number of frames to average)
# Higher values = smoother but more lag
# Lower values = more responsive but jittery
# Typical range: 4 to 16
smoothing_buffer_size = 8

[camera]
# Camera index (0 for default, 1, 2, etc. for other cameras)
camera_index = 0

[ui]
# Show iris markers on the video feed
show_iris_markers = true

# Show instructions overlay
show_instructions = true

# Click feedback duration in frames
click_feedback_frames = 10
